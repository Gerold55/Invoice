<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Secure Login – Turning Skies Safaris</title>
<style>
    body { background: #121a16; color: #e6ece8; font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #1b2621; border: 1px solid #2e3b35; padding: 35px; border-radius: 10px; width: 330px; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
    h2 { font-family: Georgia, serif; color: #b98a2b; margin-top: 0; text-align: center; }
    p { color: #9aa8a0; font-size: 13px; text-align: center; margin-bottom: 24px; }
    label { display: block; font-size: 13px; color: #9aa8a0; margin: 12px 0 4px; }
    input { width: 100%; box-sizing: border-box; background: #121a16; border: 1px solid #2e3b35; color: #e6ece8; padding: 10px; border-radius: 6px; font-size: 14px; }
    button { width: 100%; background: #1f4a3a; color: white; border: none; padding: 11px; border-radius: 6px; font-weight: bold; margin-top: 22px; cursor: pointer; }
    button:hover { background: #285d49; }
    .error { color: #ff6b6b; font-size: 13px; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<div class="card">
    <h2>Turning Skies</h2>
    <p>Secure Invoice Portal</p>
    <form method="POST">
        <label>Username</label>
        <input type="text" name="username" value="admin" required autofocus>
        <label>Password</label>
        <input type="password" name="password" required>
        <button type="submit">Authenticate & Enter</button>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </form>
</div>
</body>
</html>
